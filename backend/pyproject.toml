[project]
name = "jobmatch-api"
version = "0.1.0"
description = "JobMatch AI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic[email]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "psycopg[binary,pool]",
    "alembic",
    "redis",
    "arq",
    "argon2-cffi",
    "pyjwt",
    "httpx",
    "prometheus-client",
    "pgvector",
    "onnxruntime",
    "tokenizers",
    "numpy",
    "pyyaml",
    "bm25s>=0.3.16",
    "pystemmer>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "pip-audit",
    "types-PyYAML",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ASYNC240"]
"alembic/**" = ["S101"]
# Location and salary strings really contain en and em dashes; the rules must match them.
"app/ingest/**" = ["RUF001", "RUF002", "RUF003"]
"tests/test_ingest_*.py" = ["S101", "S105", "S106", "RUF001", "RUF002", "RUF003"]
"tests/test_salary_text.py" = ["S101", "S105", "S106", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
# onnxruntime ships no type information.
module = ["onnxruntime", "onnxruntime.*", "bm25s", "bm25s.*", "Stemmer"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers -p no:cacheprovider"
markers = [
    "slow: real ONNX models, ingest/integration runs and timing-based tests (`make test` skips them; `make test-all` and CI run everything)",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async engine runs on greenlets; without this, lines after an await are missed.
concurrency = ["greenlet", "thread"]
