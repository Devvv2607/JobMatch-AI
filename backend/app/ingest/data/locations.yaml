# US states: full names and two-letter abbreviations (abbreviations only match as the last
# part of a comma-separated location, as in "Austin, TX"). "IN" (Indiana) is left out:
# in this product it far more often means India, as in "Bangalore, IN".
us_states:
  names: [alabama, alaska, arizona, arkansas, california, colorado, connecticut, delaware,
          florida, georgia, hawaii, idaho, illinois, indiana, iowa, kansas, kentucky,
          louisiana, maine, maryland, massachusetts, michigan, minnesota, mississippi,
          missouri, montana, nebraska, nevada, new hampshire, new jersey, new mexico,
          north carolina, north dakota, ohio, oklahoma, oregon, pennsylvania, rhode island,
          south carolina, south dakota, tennessee, texas, utah, vermont, virginia,
          washington, west virginia, wisconsin, wyoming, district of columbia]
  abbreviations: [al, ak, az, ar, ca, co, ct, de, fl, ga, hi, id, il, ia, ks, ky, la,
                  me, md, ma, mi, mn, ms, mo, mt, ne, nv, nh, nj, nm, ny, nc, nd, oh, ok,
                  or, pa, ri, sc, sd, tn, tx, ut, vt, va, wa, wv, wi, wy, dc]

