# Location gazetteer for work-eligibility rules. Lower-case keys; matching is on whole
# tokens after the location string is split on separators. Codes are ISO 3166-1 alpha-2.
# 'NO' (Norway) is quoted: unquoted, YAML reads it as the boolean false.

# Phrases meaning "can be done from anywhere".
worldwide:
  - worldwide
  - anywhere
  - global
  - globally
  - work from anywhere
  - remote global
  - remote worldwide
  - remote anywhere
  - fully distributed
  - all countries
  - international

