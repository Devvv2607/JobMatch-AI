# Boards ingested by JobMatch. Every token was checked live on 2026-11-17 with
# `python -m app.ingest.cli check-boards` (dead tokens removed).
#
# Selection: companies with at least one current posting in India, or postings that are
# explicitly open in APAC, Singapore or worldwide. Tokens that resolve to a different
# company than the name suggests (e.g. Lever "neon" is a Brazilian bank) were excluded,
# as was the smaller board when one company is live on two ATSs.
#
# industries: hard-filter tags for dealbreakers such as "no fintech". Vocabulary:
# ai, developer-tools, data-infrastructure, databases, observability, security,
# cloud-infrastructure, open-source, fintech, payments, crypto, consumer, marketplace,
# e-commerce, edtech, travel, gaming, media, adtech, saas, productivity, enterprise-software,
# hr-tech, sales-tech, legal-tech, voice-ai.

