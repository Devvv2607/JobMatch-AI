# Static FX table used to normalise salaries for filtering. Deliberately not live:
# filters must be reproducible, and coarse rates are fine for "not below X".
#
# Source: European Central Bank euro foreign exchange reference rates,
# https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml
# Values are units of each currency per 1 EUR, copied as published.
# USD per unit = per_eur[USD] / per_eur[X].
# AED is not published by the ECB; it is pegged at 3.6725 per USD and derived from that.
date: "2026-11-16"
source: ECB euro foreign exchange reference rates
