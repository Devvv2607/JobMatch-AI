# Canonical skill taxonomy. Shared by ingestion (skills extracted from job text) and,
# from Phase 3, by matching (candidate skills vs job skills).
#
# Each entry: canonical name -> aliases. Matching is case-insensitive on whole words.
# Exceptions:
# - names listed under `case_sensitive` match only with that exact casing ("React", not
#   "react to feedback");
# - aliases starting with `re:` are raw regular expressions, matched case-sensitively.
#   They are used for names that are ordinary words ("Go", "R") so those only match
#   inside a list of technologies ("Python, Go, Java"), not in prose ("Go above").
# The canonical name itself matches case-insensitively, unless listed in case_sensitive
# or the entry sets `match_name: false` (for names that are ordinary words).
# Ambiguous short aliases (cv, rest, spring, node, tf, torch, lambda) are deliberately
# absent.

languages:
  Python: {aliases: [python3]}
  Java: {aliases: [java8, java11, java17, "core java"]}
  JavaScript: {aliases: [javascript, ecmascript, es6, js]}
  TypeScript: {aliases: [typescript, ts]}
  Go: {aliases: [golang, 're:(?<=[,/(] )Go(?=\s*[,/)])', 're:(?<=[,/(])Go(?=[,/)])'], match_name: false}
  Rust: {aliases: [rustlang]}
  C++: {aliases: [cpp, "c plus plus"]}
  C#: {aliases: [csharp, "c sharp"]}
  C: {aliases: [c programming, ansi c, embedded c, 're:(?<=[,/(] )C(?=\s*[,/)])'], match_name: false}
  Kotlin: {aliases: []}
  Swift: {aliases: [], case_sensitive: [Swift]}
  Objective-C: {aliases: [objective c, objc]}
  Ruby: {aliases: []}
  PHP: {aliases: []}
  Scala: {aliases: []}
  R: {aliases: [rstudio, tidyverse, ggplot2, r programming, 're:(?<=[,/(] )R(?=\s*[,/)])'], match_name: false}
  SQL: {aliases: [t-sql, tsql, pl/sql, plsql, ansi sql]}
  Bash: {aliases: [shell scripting, shell script, zsh]}
  Elixir: {aliases: []}
  Haskell: {aliases: []}
  Solidity: {aliases: []}
