# Standard-time UTC offsets (hours) per country in locations.yaml, as [min, max] across the
# country's zones. Used to turn a timezone-only work restriction (Himalayas'
# timezoneRestrictions) into the countries a candidate can be in: a country counts when
# its whole range lies within the restriction widened by one hour (for daylight saving).
# Written 2026-11-24 from the IANA time zone database's standard offsets.
