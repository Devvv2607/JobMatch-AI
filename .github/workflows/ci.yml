name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobmatch
          POSTGRES_PASSWORD: jobmatch
          POSTGRES_DB: jobmatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobmatch" --health-interval 5s
          --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://jobmatch:jobmatch@localhost:5432/jobmatch
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          working-directory: backend
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy app tests scripts
      - name: Pytest (no network, stubbed LLM)
        run: uv run pytest -n 4 --cov=app --cov-report=term-missing
      - name: OpenAPI schema matches the committed copy the frontend types come from
        run: uv run python -m scripts.export_openapi | diff -u ../frontend/openapi.json -
      - name: Dependency audit
        run: uv run pip-audit

  frontend:
    name: Frontend (lint, types, build, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm run lint
      - name: Generated API types are up to date
        run: npm run check:api
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=moderate

  docker:
    name: Docker images build, model tests in the image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: Backend image (prod target)
        uses: docker/build-push-action@v7.4.0
        with:
          context: backend
          target: prod
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      # The real int8 models exist only in the image, so their tests are skipped in the
      # backend job above; they run here, against the dev image the prod build cached.
      - name: Backend image (dev target, with the models)
        uses: docker/build-push-action@v7.4.0
        with:
          context: backend
          target: dev
          load: true
          tags: jobmatch-backend:dev
          cache-from: type=gha,scope=backend
      - name: Embedder and reranker tests against the real models
        run: |
          docker compose up -d --wait db redis
          docker compose run --rm --no-deps api \
            pytest -p no:cacheprovider tests/test_embedder.py tests/test_reranker.py
      # Phase 4 regression gate: the committed reduced corpus, real models, committed
      # LLM-judged (Gemini) labels; fails if a gated variant's NDCG@10 drops > 0.02.
      # Non-blocking until the baseline is re-measured on the final (depth-10) labels
      # (owner, 2026-11-27); then this continue-on-error line is removed.
      - name: Eval regression gate (reduced corpus, NDCG@10)
        continue-on-error: true
        run: docker compose run --rm --no-deps api python -m app.eval.cli gate
      - name: Frontend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
